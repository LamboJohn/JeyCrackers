<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" role="img" aria-labelledby="title desc">
  <title id="title">Jeycrackers logo</title>
  <desc id="desc">Gold Jeycrackers wordmark with a rocket shaped J mark.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff06a"/>
      <stop offset="0.35" stop-color="#ffd700"/>
      <stop offset="0.66" stop-color="#ff8c00"/>
      <stop offset="1" stop-color="#b84a00"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff6a1a"/>
      <stop offset="0.45" stop-color="#ff2400"/>
      <stop offset="1" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity="0.82"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="680" height="170" rx="18" fill="#3b0202"/>
  <g filter="url(#shadow)">
    <path d="M129 35 169 18 184 72 162 67 143 124c-11 34-46 42-72 26-15-9-24-24-24-41h35c1 14 14 23 28 17 10-4 15-12 19-25l16-48-16-14Z" fill="url(#rocket)"/>
    <path d="M138 42 168 29 174 51 144 58Z" fill="#ffb000" opacity="0.85"/>
    <path d="M136 66 176 57 181 75 134 84Z" fill="#ffb000" opacity="0.85"/>
    <path d="M125 91c-16 0-28 12-28 28" fill="none" stroke="#ff4500" stroke-width="9" stroke-linecap="round"/>
    <path d="M76 84 82 96 95 98 85 107 88 120 76 113 65 120 68 107 58 98 71 96Z" fill="#ffd700" filter="url(#glow)"/>
    <path d="M48 110 53 119 63 121 56 128 58 138 48 133 39 138 41 128 34 121 44 119Z" fill="#ff8c00" filter="url(#glow)"/>
    <circle cx="60" cy="91" r="6" fill="#ffd700"/>
    <circle cx="36" cy="103" r="5" fill="#ff4500"/>
  </g>

  <text x="205" y="105"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="66"
        font-weight="900"
        letter-spacing="-1"
        fill="url(#gold)"
        stroke="#672000"
        stroke-width="1.2"
        filter="url(#shadow)">JEYCRACKERS</text>
</svg>
